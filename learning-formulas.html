<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="color-scheme" content="dark light"><title>📖 公式大全｜MathBox</title><link rel="stylesheet" href="style.css?v=8.0"></head><body data-page="formulas"><header class="site-header"><div><a class="brand" href="index.html">📐 MathBox</a><div class="subtitle">數學、化學、教學與實用工具</div></div><button id="themeToggle" class="icon-btn">🌙</button></header><main class="container"><section class="section-title"><div><h1>📖 公式大全</h1></div></section><input class="search-input" id="search" placeholder="搜尋公式，例如：圓、二次、距離、三角"><div id="formulaList" class="formula-list"></div><script>const fs=[['兩點距離','d=√((x₂−x₁)²+(y₂−y₁)²)'],['中點','M=((x₁+x₂)/2,(y₁+y₂)/2)'],['斜率','m=(y₂−y₁)/(x₂−x₁)'],['圓面積','A=πr²'],['圓周長','C=2πr'],['三角形面積','A=底×高÷2'],['矩形面積','A=長×寬'],['梯形面積','A=(上底+下底)×高÷2'],['球體積','V=4πr³/3'],['圓柱體積','V=πr²h'],['二次函數頂點','x=−b/(2a)'],['三次函數','f(x)=ax³+bx²+cx+d'],['三次函數一階導數','f′(x)=3ax²+2bx+c'],['三次函數二階導數','f″(x)=6ax+2b'],['三次函數反曲點','x=−b/(3a)'],['等差通項','aₙ=a₁+(n−1)d'],['等比通項','aₙ=a₁rⁿ⁻¹'],['排列','P(n,r)=n!/(n−r)!'],['組合','C(n,r)=n!/[r!(n−r)!]'],['基本機率','P(A)=有利結果數/全部結果數']];function render(){let q=search.value.toLowerCase();formulaList.innerHTML=fs.filter(x=>(x[0]+x[1]).toLowerCase().includes(q)).map(x=>`<div class="tool-card"><h2>${x[0]}</h2><div class="formula big-formula">${x[1]}</div></div>`).join('')}search.oninput=render;render()</script></main><footer>MathBox · 純 HTML / CSS / JavaScript · GitHub Pages 可直接使用</footer><script src="script.js?v=8.0"></script></body></html>
