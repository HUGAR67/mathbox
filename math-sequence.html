<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="color-scheme" content="dark light"><title>🔢 數列｜MathBox</title><link rel="stylesheet" href="style.css?v=8.0"></head><body data-page="sequence"><header class="site-header"><div><a class="brand" href="index.html">📐 MathBox</a><div class="subtitle">數學、化學、教學與實用工具</div></div><button id="themeToggle" class="icon-btn">🌙</button></header><main class="container"><section class="section-title"><div><h1>🔢 數列</h1></div></section><div class="tool-grid"><section class="tool-card"><h2>等差數列</h2><div class="formula">aₙ=a₁+(n−1)d</div><input id="a1" type="number" placeholder="首項 a₁"><input id="dd" type="number" placeholder="公差 d"><input id="nn" type="number" placeholder="第 n 項"><button class="primary" onclick="ap()">計算</button><div id="ar" class="mini-result"></div></section><section class="tool-card"><h2>等比數列</h2><div class="formula">aₙ=a₁rⁿ⁻¹</div><input id="ga1" type="number" placeholder="首項 a₁"><input id="rrr" type="number" placeholder="公比 r"><input id="nnn" type="number" placeholder="第 n 項"><button class="primary" onclick="gp()">計算</button><div id="gr" class="mini-result"></div></section></div><script>function ap(){let a=+a1.value,d=+dd.value,n=+nn.value;ar.textContent='aₙ = '+(a+(n-1)*d)}function gp(){let a=+ga1.value,r=+rrr.value,n=+nnn.value;gr.textContent='aₙ = '+(a*Math.pow(r,n-1))}</script></main><footer>MathBox · 純 HTML / CSS / JavaScript · GitHub Pages 可直接使用</footer><script src="script.js?v=8.0"></script></body></html>
