<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="color-scheme" content="dark light"><title>🔢 數與代數｜MathBox</title><link rel="stylesheet" href="style.css?v=8.0"></head><body data-page="algebra"><header class="site-header"><div><a class="brand" href="index.html">📐 MathBox</a><div class="subtitle">數學、化學、教學與實用工具</div></div><button id="themeToggle" class="icon-btn">🌙</button></header><main class="container"><section class="section-title"><div><h1>🔢 數與代數</h1></div></section><div class="tool-grid"><section class="tool-card"><h2>一次方程式 ax + b = c</h2><div class="formula">x = (c − b) ÷ a</div><input id="aa" type="number" placeholder="a"><input id="bb" type="number" placeholder="b"><input id="cc" type="number" placeholder="c"><button class="primary" onclick="lin()">計算 x</button><div id="lr" class="mini-result"></div></section><section class="tool-card"><h2>比例</h2><div class="formula">a : b = c : x → x = bc ÷ a</div><input id="pa" type="number" placeholder="a"><input id="pb" type="number" placeholder="b"><input id="pc" type="number" placeholder="c"><button class="primary" onclick="ratio()">求 x</button><div id="pr" class="mini-result"></div></section><section class="tool-card"><h2>指數</h2><div class="formula">aⁿ</div><input id="ba" type="number" placeholder="底數 a"><input id="bn" type="number" placeholder="指數 n"><button class="primary" onclick="power()">計算</button><div id="br" class="mini-result"></div></section><section class="tool-card"><h2>絕對值距離</h2><div class="formula">|a − b|</div><input id="xa" type="number" placeholder="a"><input id="xb" type="number" placeholder="b"><button class="primary" onclick="dist1()">計算</button><div id="xr" class="mini-result"></div></section></div><script>const q=id=>Number(document.getElementById(id).value);function lin(){let a=q('aa'),b=q('bb'),c=q('cc');lr.textContent=a===0?'a 不能是 0':'x = '+((c-b)/a)}function ratio(){let a=q('pa'),b=q('pb'),c=q('pc');pr.textContent=a===0?'a 不能是 0':'x = '+(b*c/a)}function power(){br.textContent='答案：'+Math.pow(q('ba'),q('bn'))}function dist1(){xr.textContent='答案：'+Math.abs(q('xa')-q('xb'))}</script></main><footer>MathBox · 純 HTML / CSS / JavaScript · GitHub Pages 可直接使用</footer><script src="script.js?v=8.0"></script></body></html>
