<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="color-scheme" content="dark light"><title>📊 統計｜MathBox</title><link rel="stylesheet" href="style.css?v=8.0"></head><body data-page="statistics"><header class="site-header"><div><a class="brand" href="index.html">📐 MathBox</a><div class="subtitle">數學、化學、教學與實用工具</div></div><button id="themeToggle" class="icon-btn">🌙</button></header><main class="container"><section class="section-title"><div><h1>📊 統計</h1></div></section><div class="tool-grid"><section class="tool-card"><h2>平均／中位數／眾數</h2><input id="data" placeholder="例如：10,20,20,30,40"><button class="primary" onclick="stats()">計算</button><div id="res" class="mini-result"></div></section><section class="tool-card"><h2>加權平均</h2><div class="formula">Σ(數值×權重) ÷ Σ權重</div><input id="vals" placeholder="數值：80,90,70"><input id="weights" placeholder="權重：3,4,3"><button class="primary" onclick="weighted()">計算</button><div id="wr" class="mini-result"></div></section><section class="tool-card"><h2>範圍</h2><input id="range" placeholder="例如：3,7,2,10,5"><button class="primary" onclick="rangeCalc()">計算</button><div id="rr" class="mini-result"></div></section></div><script>function arr(id){return document.getElementById(id).value.split(',').map(Number).filter(Number.isFinite)}function stats(){let a=arr('data').sort((x,y)=>x-y);if(!a.length)return;let mean=a.reduce((x,y)=>x+y,0)/a.length,mid=a.length%2?a[(a.length-1)/2]:(a[a.length/2-1]+a[a.length/2])/2,c={};a.forEach(x=>c[x]=(c[x]||0)+1);let mx=Math.max(...Object.values(c)),modes=Object.keys(c).filter(x=>c[x]===mx);res.textContent=`平均 = ${mean}，中位數 = ${mid}，眾數 = ${modes.join(', ')}`}function weighted(){let a=arr('vals'),w=arr('weights');if(a.length!==w.length||!a.length){wr.textContent='請確認數值與權重數量相同';return}let s=a.reduce((t,x,i)=>t+x*w[i],0),z=w.reduce((t,x)=>t+x,0);wr.textContent='加權平均 = '+s/z}function rangeCalc(){let a=arr('range');rr.textContent=a.length?'範圍 = '+(Math.max(...a)-Math.min(...a)):'請輸入資料'}</script></main><footer>MathBox · 純 HTML / CSS / JavaScript · GitHub Pages 可直接使用</footer><script src="script.js?v=8.0"></script></body></html>
