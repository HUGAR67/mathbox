<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MathBox 化學方程式配平與元素週期表">
    <title>🧪 化學方程式配平 | MathBox</title>
    <link rel="stylesheet" href="./style.css?v=5">
</head>
<body data-page="chemistry">
    <header class="site-header">
        <div class="brand">
            <a href="index.html">📐 MathBox</a>
            <div class="subtitle">數學 · 科學 · 工具 · 一站式</div>
        </div>
        <button id="themeToggle" class="icon-btn" title="切換深色模式">🌙</button>
    </header>

    <main class="container">
        <nav class="tabs">
            <a class="tab" href="calculator.html">🧮 計算機</a>
            <a class="tab" href="quadratic.html">🔢 方程式</a>
            <a class="tab" href="graph.html">📈 函數繪圖</a>
            <a class="tab" href="analysis.html">📊 數據分析</a>
            <a class="tab" href="statistics.html">📋 統計</a>
            <a class="tab" href="units.html">📏 單位換算</a>
            <a class="tab active" href="chemistry.html">🧪 化學配平</a>
            <a class="tab" href="history.html">🕒 紀錄</a>
        </nav>

        <section class="section-title">
            <div>
                <h1>🧪 化學方程式配平</h1>
                <p>這一頁可以直接點選週期表組成化學式，再加入反應物與生成物；並具備自動配平功能。</p>
            </div>
        </section>

        <div class="chem-layout">
            <div class="form-card chem-builder">
                <div class="builder-head">
                    <h2>① 用週期表組成分子</h2>
                </div>
                <div class="side-switch">
                    <label><input type="radio" name="chemSide" value="left" checked> 反應物</label>
                    <label><input type="radio" name="chemSide" value="right"> 生成物</label>
                </div>
                <div id="selectedElement" class="selected-element">尚未選擇元素</div>
                <div class="subscript-row">
                    <label>下標 <input id="elementCount" type="number" min="1" max="99" value="1"></label>
                    <button id="addElement" class="primary">加入元素</button>
                    <button id="clearMolecule" class="secondary">清空分子</button>
                </div>
                <div class="current-mol-box">
                    <h3>目前分子：<span id="currentMoleculeText">—</span></h3>
                </div>
                <button id="addFormula" class="primary full">＋ 把目前分子加入反應式</button>
                <div class="equation-preview">
                    <div class="side-list">
                        <h4>反應物</h4>
                        <div id="leftMolecules" class="molecule-list"></div>
                    </div>
                    <div class="arrow">➔</div>
                    <div class="side-list">
                        <h4>生成物</h4>
                        <div id="rightMolecules" class="molecule-list"></div>
                    </div>
                </div>
                <button id="balanceBuilt" class="primary full">🧪 配平目前反應式</button>
                <div id="builtResult" class="result-box"></div>
            </div>

            <div class="chem-card periodic-wrap">
                <h2>② 點選元素</h2>
                <p class="muted">元素符號、原子序與名稱均依據 IUPAC 週期表標準整理。</p>
                <div id="periodicTable" class="periodic-table"></div>
                <div class="lanth-actinide-note">鑭系與錒系亦可配平</div>
            </div>

            <div class="form-card">
                <h2>直接輸入也可以</h2>
                <input id="chemicalInput" class="big-input" value="C6H12O6 + O2 -> CO2 + H2O" placeholder="例如：C6H12O6 + O2 -> CO2 + H2O">
                <div class="chem-examples">
                    <button data-chem="H2 + O2 -> H2O">H₂ + O₂ ➔ H₂O</button>
                    <button data-chem="Fe + O2 -> Fe2O3">Fe + O₂ ➔ Fe₂O₃</button>
                    <button data-chem="C3H8 + O2 -> CO2 + H2O">C₃H₈ + O₂ ➔ CO₂ + H₂O</button>
                    <button data-chem="Al + HCl -> AlCl3 + H2">Al + HCl ➔ AlCl₃ + H₂</button>
                    <button data-chem="C6H12O6 + O2 -> CO2 + H2O">C₆H₁₂O₆ + O₂ ➔ CO₂ + H₂O</button>
                </div>
                <button id="balanceInput" class="primary full">🧪 開始配平</button>
                <div id="inputResult" class="result-box"></div>
            </div>
        </div>
    </main>
    <script src="./script.js"></script>
</body>
</html>
