<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="color-scheme" content="dark light"><meta name="description" content="MathBox 數學與化學學習工具"><title>數學練習題｜MathBox</title><link rel="stylesheet" href="./style.css?v=7.0"></head><body data-page="practice"><header class="site-header"><div><a class="brand" href="index.html">📐 MathBox</a><div class="subtitle">數學、統計、幾何、化學工具箱與學習中心</div></div><button id="themeToggle" class="icon-btn" title="切換深色模式">🌙</button></header><main class="container"><section class="section-title"><div><h1>📝 數學練習題</h1><p>先自己算，再按「顯示答案」。題目會隨機產生。</p></div></section><div class="practice-card tool-card"><div class="practice-meta"><span id="practiceTopic">一次方程式</span><span id="practiceScore">答對：0</span></div><div id="practiceQuestion" class="practice-question"></div><input id="practiceAnswer" type="number" placeholder="輸入你的答案"><div class="action-row"><button class="primary" id="checkPractice">檢查答案</button><button class="secondary" id="showPractice">顯示答案</button><button class="secondary" id="nextPractice">下一題</button></div><div id="practiceResult" class="mini-result"></div></div><div class="practice-topics"><button class="secondary topic-btn active" data-topic="linear">一次方程式</button><button class="secondary topic-btn" data-topic="percent">百分比</button><button class="secondary topic-btn" data-topic="sequence">等差數列</button><button class="secondary topic-btn" data-topic="geometry">兩點距離</button></div><script>(()=>{let topic='linear',ans=0,score=0,current={};const $=id=>document.getElementById(id);const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;function newQ(){if(topic==='linear'){let x=rnd(-10,15),a=rnd(2,9),b=rnd(-10,10),c=a*x+b;current={ans:x};$('practiceTopic').textContent='一次方程式';$('practiceQuestion').textContent=`解方程式：${a}x ${b>=0?'+ '+b:'- '+Math.abs(b)} = ${c}`}else if(topic==='percent'){let n=rnd(20,500),p=rnd(5,50);current={ans:n*p/100};$('practiceTopic').textContent='百分比';$('practiceQuestion').textContent=`${n} 的 ${p}% 是多少？`}else if(topic==='sequence'){let a=rnd(-5,10),d=rnd(2,8),n=rnd(4,10);current={ans:a+(n-1)*d};$('practiceTopic').textContent='等差數列';$('practiceQuestion').textContent=`等差數列 ${a}, ${a+d}, ${a+2*d}, …，第 ${n} 項是多少？`}else{let x1=rnd(-4,4),y1=rnd(-4,4),x2=x1+rnd(3,6),y2=y1+rnd(0,4);let dx=x2-x1,dy=y2-y1;current={ans:Math.sqrt(dx*dx+dy*dy)};$('practiceTopic').textContent='兩點距離';$('practiceQuestion').textContent=`A(${x1}, ${y1})、B(${x2}, ${y2}) 的距離是多少？（可輸入小數）`}$('practiceAnswer').value='';$('practiceResult').textContent='';$('practiceScore').textContent=`答對：${score}`}function check(){let v=Number($('practiceAnswer').value);if(!Number.isFinite(v))return $('practiceResult').textContent='請先輸入答案';if(Math.abs(v-current.ans)<1e-9){score++;$('practiceResult').textContent='✅ 答對了！';$('practiceScore').textContent=`答對：${score}`}else $('practiceResult').textContent='❌ 還不對，再試一次，或按「顯示答案」。'}$('checkPractice').onclick=check;$('showPractice').onclick=()=>{$('practiceResult').textContent=`答案：${Number.isInteger(current.ans)?current.ans:current.ans.toFixed(4).replace(/0+$/,'').replace(/\.$/,'')}`};$('nextPractice').onclick=newQ;document.querySelectorAll('.topic-btn').forEach(b=>b.onclick=()=>{document.querySelectorAll('.topic-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');topic=b.dataset.topic;newQ()});newQ()})()</script></main><footer>MathBox · 純 HTML / CSS / JavaScript · GitHub Pages 可直接使用</footer><script src="./script.js?v=7.0"></script></body></html>
