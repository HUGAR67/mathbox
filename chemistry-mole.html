<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="color-scheme" content="dark light"><title>🧪 莫耳計算｜MathBox</title><link rel="stylesheet" href="style.css?v=8.0"></head><body data-page="mole"><header class="site-header"><div><a class="brand" href="index.html">📐 MathBox</a><div class="subtitle">數學、化學、教學與實用工具</div></div><button id="themeToggle" class="icon-btn">🌙</button></header><main class="container"><section class="section-title"><div><h1>🧪 莫耳計算</h1></div></section><div class="tool-grid"><section class="tool-card"><h2>質量 → 莫耳</h2><div class="formula">n=m÷M</div><input id="m" type="number" placeholder="質量 m (g)"><input id="mm" type="number" placeholder="摩爾質量 M (g/mol)"><button class="primary" onclick="mol()">計算</button><div id="mr" class="mini-result"></div></section><section class="tool-card"><h2>莫耳 → 質量</h2><div class="formula">m=n×M</div><input id="nn" type="number" placeholder="莫耳數 n"><input id="mmm" type="number" placeholder="摩爾質量 M (g/mol)"><button class="primary" onclick="mass()">計算</button><div id="ms" class="mini-result"></div></section></div><script>function mol(){mr.textContent='n = '+(+m.value/+mm.value)+' mol'}function mass(){ms.textContent='m = '+(+nn.value*+mmm.value)+' g'}</script></main><footer>MathBox · 純 HTML / CSS / JavaScript · GitHub Pages 可直接使用</footer><script src="script.js?v=8.0"></script></body></html>
