<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="color-scheme" content="dark light"><meta name="description" content="MathBox 數學與化學學習工具"><title>基礎數學工具｜MathBox</title><link rel="stylesheet" href="./style.css?v=7.0"></head><body data-page="basic-math"><header class="site-header"><div><a class="brand" href="index.html">📐 MathBox</a><div class="subtitle">數學、統計、幾何、化學工具箱與學習中心</div></div><button id="themeToggle" class="icon-btn" title="切換深色模式">🌙</button></header><main class="container"><section class="section-title"><div><h1>🧮 基礎數學工具</h1><p>一些平常很常用、但原本 MathBox 沒有獨立工具的計算。</p></div></section>
<div class="basic-tool-grid">
<div class="tool-card"><h2>％ 百分比</h2><div class="formula">結果 = 數值 × 百分比</div><div class="two-col"><label>數值<input id="pctN" type="number" placeholder="例如 250"></label><label>百分比<input id="pctP" type="number" placeholder="例如 18"></label></div><button class="primary" id="calcPct">計算</button><div class="mini-result" id="pctR"></div></div>
<div class="tool-card"><h2>🔢 最大公因數 / 最小公倍數</h2><div class="two-col"><label>第一個數<input id="gcdA" type="number" placeholder="例如 24"></label><label>第二個數<input id="gcdB" type="number" placeholder="例如 36"></label></div><button class="primary" id="calcGcd">計算</button><div class="mini-result" id="gcdR"></div></div>
<div class="tool-card"><h2>⭐ 質數判斷</h2><label>輸入整數<input id="primeN" type="number" step="1" placeholder="例如 97"></label><button class="primary" id="calcPrime">判斷</button><div class="mini-result" id="primeR"></div></div>
<div class="tool-card"><h2>➗ 分數約分</h2><div class="two-col"><label>分子<input id="fracA" type="number" step="1" placeholder="例如 84"></label><label>分母<input id="fracB" type="number" step="1" placeholder="例如 126"></label></div><button class="primary" id="calcFrac">約分</button><div class="mini-result" id="fracR"></div></div>
</div>
<script>(()=>{const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a}function num(id){return Number($(id).value)}$('calcPct').onclick=()=>{$('pctR').textContent=Number.isFinite(num('pctN'))&&Number.isFinite(num('pctP'))?`${num('pctN')} 的 ${num('pctP')}% = ${num('pctN')*num('pctP')/100}`:'請輸入數字';};$('calcGcd').onclick=()=>{let a=num('gcdA'),b=num('gcdB');if(!Number.isInteger(a)||!Number.isInteger(b)){return $('gcdR').textContent='請輸入整數'}let g=gcd(a,b),l=Math.abs(a*b)/g;$('gcdR').textContent=`最大公因數 = ${g}　｜　最小公倍數 = ${l}`};$('calcPrime').onclick=()=>{let n=num('primeN');if(!Number.isInteger(n)||n<2)return $('primeR').textContent='不是質數（質數必須是大於 1 的整數）';let p=true;for(let i=2;i*i<=n;i++)if(n%i===0){p=false;break}$('primeR').textContent=p?`${n} 是質數`:`${n} 不是質數`};$('calcFrac').onclick=()=>{let a=num('fracA'),b=num('fracB');if(!Number.isInteger(a)||!Number.isInteger(b)||b===0)return $('fracR').textContent='請輸入有效的整數分數';let g=gcd(a,b);a/=g;b/=g;if(b<0){a=-a;b=-b}$('fracR').textContent=`${a} / ${b}`}})();</script></main><footer>MathBox · 純 HTML / CSS / JavaScript · GitHub Pages 可直接使用</footer><script src="./script.js?v=7.0"></script></body></html>
