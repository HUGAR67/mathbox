-result"></div></div><div class="tool-card"><h2>⚪ 球</h2><label>半徑<input id="sphereR" type="number" value="3"></label><button id="calcSphere" class="primary">計算</button><div id="sphereResult" class="mini-result"></div></div><div class="tool-card"><h2>🥫 圓柱</h2><label>半徑<input id="cylR" type="number" value="3"></label><label>高<input id="cylH" type="number" value="5"></label><button id="calcCylinder" class="primary">計算</button><div id="cylResult" class="mini-result"></div></div><div class="tool-card"><h2>🔺 圓錐</h2><label>半徑<input id="coneR" type="number" value="3"></label><label>高<input id="coneH" type="number" value="5"></label><button id="calcCone" class="primary">計算</button><div id="coneResult" class="mini-result"></div></div><div class="tool-card"><h2>📍 兩點距離</h2><label>x₁<input id="dx1" type="number" value="1"></label><label>y₁<input id="dy1" type="number" value="2"></label><label>x₂<input id="dx2" type="number" value="5"></label><label>y₂<input id="dy2" type="number" value="5"></label><button id="calcDistance" class="primary">計算</button><div id="distanceResult" class="mini-result"></div></div></div></main><footer>MathBox · 純 HTML / CSS / JavaScript · GitHub Pages 可直接使用</footer><script src="./script.js?v=5"></script></body></html>
