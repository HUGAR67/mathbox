<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="color-scheme" content="dark light"><title>➗ 基礎計算｜MathBox</title><link rel="stylesheet" href="style.css?v=8.0"></head><body data-page="basic-math"><header class="site-header"><div><a class="brand" href="index.html">📐 MathBox</a><div class="subtitle">數學、化學、教學與實用工具</div></div><button id="themeToggle" class="icon-btn">🌙</button></header><main class="container"><section class="section-title"><div><h1>➗ 基礎計算</h1></div></section><div class="tool-grid"><section class="tool-card"><h2>百分比</h2><div class="formula">結果 = 數值 × 百分比 ÷ 100</div><input id="pctA" type="number" placeholder="請輸入數值"><input id="pctB" type="number" placeholder="請輸入百分比"><button class="primary" onclick="pct()">計算</button><div id="pctR" class="mini-result"></div></section><section class="tool-card"><h2>GCD / LCM</h2><input id="gA" type="number" placeholder="第一個整數"><input id="gB" type="number" placeholder="第二個整數"><button class="primary" onclick="gcdlcm()">計算</button><div id="gR" class="mini-result"></div></section><section class="tool-card"><h2>質數判斷</h2><input id="primeN" type="number" placeholder="請輸入整數"><button class="primary" onclick="primeCheck()">判斷</button><div id="primeR" class="mini-result"></div></section><section class="tool-card"><h2>質因數分解</h2><input id="factorN" type="number" placeholder="請輸入正整數"><button class="primary" onclick="factorize()">分解</button><div id="factorR" class="mini-result"></div></section><section class="tool-card"><h2>四捨五入</h2><input id="roundN" type="number" placeholder="數字"><input id="roundD" type="number" value="2" placeholder="小數位數"><button class="primary" onclick="roundNum()">計算</button><div id="roundR" class="mini-result"></div></section><section class="tool-card"><h2>絕對值</h2><input id="absN" type="number" placeholder="請輸入數字"><button class="primary" onclick="absNum()">計算</button><div id="absR" class="mini-result"></div></section></div><script>function n(id){return Number(document.getElementById(id).value)}function pct(){pctR.textContent='答案：'+n('pctA')*n('pctB')/100}function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a}function gcdlcm(){let a=n('gA'),b=n('gB'),g=gcd(a,b);gR.textContent=`GCD = ${g}，LCM = ${g?Math.abs(a*b)/g:0}`}function primeCheck(){let x=n('primeN');if(x<2||x%1){primeR.textContent='不是質數';return}for(let i=2;i*i<=x;i++)if(x%i===0){primeR.textContent='不是質數';return}primeR.textContent='是質數'}function factorize(){let x=Math.floor(n('factorN'));if(x<1){factorR.textContent='請輸入正整數';return}let a=[],d=2;while(d*d<=x){while(x%d===0){a.push(d);x/=d}d++}if(x>1)a.push(x);factorR.textContent='質因數：'+a.join(' × ')}function roundNum(){roundR.textContent='答案：'+n('roundN').toFixed(Math.max(0,Math.floor(n('roundD'))))}function absNum(){absR.textContent='答案：'+Math.abs(n('absN'))}</script></main><footer>MathBox · 純 HTML / CSS / JavaScript · GitHub Pages 可直接使用</footer><script src="script.js?v=8.0"></script></body></html>
