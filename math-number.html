<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="color-scheme" content="dark light"><title>🔍 數論｜MathBox</title><link rel="stylesheet" href="style.css?v=8.0"></head><body data-page="number"><header class="site-header"><div><a class="brand" href="index.html">📐 MathBox</a><div class="subtitle">數學、化學、教學與實用工具</div></div><button id="themeToggle" class="icon-btn">🌙</button></header><main class="container"><section class="section-title"><div><h1>🔍 數論</h1></div></section><div class="tool-grid"><section class="tool-card"><h2>整除性</h2><input id="dn" type="number" placeholder="整數"><input id="dd" type="number" placeholder="除數"><button class="primary" onclick="divi()">判斷</button><div id="dr" class="mini-result"></div></section><section class="tool-card"><h2>因數列舉</h2><input id="fn" type="number" placeholder="正整數"><button class="primary" onclick="factors()">列出因數</button><div id="fr" class="mini-result"></div></section><section class="tool-card"><h2>奇偶判斷</h2><input id="en" type="number" placeholder="整數"><button class="primary" onclick="even()">判斷</button><div id="er" class="mini-result"></div></section></div><script>const z=id=>Number(document.getElementById(id).value);function divi(){let a=z('dn'),b=z('dd');dr.textContent=b&&a%b===0?'可以整除':'不能整除'}function factors(){let n=Math.abs(Math.floor(z('fn'))),a=[];for(let i=1;i*i<=n;i++)if(n%i===0){a.push(i);if(i*i!==n)a.push(n/i)}a.sort((x,y)=>x-y);fr.textContent=a.join('、')}function even(){er.textContent=z('en')%2===0?'偶數':'奇數'}</script></main><footer>MathBox · 純 HTML / CSS / JavaScript · GitHub Pages 可直接使用</footer><script src="script.js?v=8.0"></script></body></html>
