<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="color-scheme" content="dark light"><title>📈 函數與座標｜MathBox</title><link rel="stylesheet" href="style.css?v=8.0"></head><body data-page="functions"><header class="site-header"><div><a class="brand" href="index.html">📐 MathBox</a><div class="subtitle">數學、化學、教學與實用工具</div></div><button id="themeToggle" class="icon-btn">🌙</button></header><main class="container"><section class="section-title"><div><h1>📈 函數與座標</h1></div></section><div class="tool-grid"><section class="tool-card"><h2>斜率</h2><div class="formula">m = (y₂ − y₁) ÷ (x₂ − x₁)</div><input id="x1" type="number" placeholder="X1"><input id="y1" type="number" placeholder="Y1"><input id="x2" type="number" placeholder="X2"><input id="y2" type="number" placeholder="Y2"><button class="primary" onclick="slope()">計算</button><div id="sr" class="mini-result"></div></section><section class="tool-card"><h2>中點</h2><div class="formula">M = ((x₁+x₂)/2, (y₁+y₂)/2)</div><input id="mx1" type="number" placeholder="X1"><input id="my1" type="number" placeholder="Y1"><input id="mx2" type="number" placeholder="X2"><input id="my2" type="number" placeholder="Y2"><button class="primary" onclick="mid()">計算</button><div id="mr" class="mini-result"></div></section><section class="tool-card"><h2>直線方程式</h2><div class="formula">y − y₁ = m(x − x₁)</div><input id="lm" type="number" placeholder="斜率 m"><input id="lx" type="number" placeholder="X1"><input id="ly" type="number" placeholder="Y1"><button class="primary" onclick="lineEq()">計算</button><div id="ler" class="mini-result"></div></section><section class="tool-card"><h2>三角比</h2><input id="ang" type="number" placeholder="角度（度）"><button class="primary" onclick="trig()">計算</button><div id="tr" class="mini-result"></div></section><section class="tool-card"><h2>三次函數</h2><p>分析實根、極值、反曲點、對稱中心、導數與圖形。</p><a class="primary button-link" href="cubic.html">進入</a></section></div><script>const v=id=>Number(document.getElementById(id).value);function slope(){let dx=v('x2')-v('x1');sr.textContent=dx===0?'斜率不存在':'m = '+((v('y2')-v('y1'))/dx)}function mid(){mr.textContent=`M = (${(v('mx1')+v('mx2'))/2}, ${(v('my1')+v('my2'))/2})`}function lineEq(){let m=v('lm'),x=v('lx'),y=v('ly'),b=y-m*x;ler.textContent=`y = ${m}x ${b>=0?'+ ':'- '}${Math.abs(b)}`}function trig(){let a=v('ang')*Math.PI/180;tr.textContent=`sin = ${Math.sin(a).toFixed(6)}，cos = ${Math.cos(a).toFixed(6)}，tan = ${Math.tan(a).toFixed(6)}`}</script></main><footer>MathBox · 純 HTML / CSS / JavaScript · GitHub Pages 可直接使用</footer><script src="script.js?v=8.0"></script></body></html>
